<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Church Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    #map { width: 100%; height: 100vh; }
    #search-bar { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); z-index: 1000; background: white; border-radius: 50px; box-shadow: 0 4px 24px rgba(0,0,0,0.18); padding: 8px 10px 8px 18px; display: flex; align-items: center; gap: 8px; min-width: 340px; max-width: 92vw; }
    #search-bar .logo { font-family: 'Cormorant Garamond', serif; font-size: 1rem; font-weight: 600; color: #1a1815; white-space: nowrap; flex-shrink: 0; }
    #search-bar .divider { width: 1px; height: 18px; background: #e8e4de; flex-shrink: 0; }
    #placeInput { border: none; outline: none; font-family: 'DM Sans', sans-serif; font-size: 0.88rem; color: #2a2825; background: transparent; width: 210px; min-width: 0; flex: 1 1 auto; }
    #placeInput::placeholder { color: #bbb; }
    #radiusSelect { border: none; outline: none; font-family: 'DM Sans', sans-serif; font-size: 0.82rem; color: #6b6762; background: transparent; cursor: pointer; flex-shrink: 0; }
    #searchBtn { background: #2a2825; color: white; border: none; border-radius: 50px; padding: 7px 16px; font-family: 'DM Sans', sans-serif; font-size: 0.82rem; font-weight: 500; cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: background 0.2s; }
    #searchBtn:hover { background: #b8955a; }
    #clearBtn { background: none; border: none; color: #bbb; font-size: 1rem; cursor: pointer; flex-shrink: 0; line-height: 1; padding: 2px 4px; border-radius: 50%; transition: color 0.2s; display: none; }
    #clearBtn:hover { color: #2a2825; }
    #clearBtn.visible { display: block; }
    #result-pill { position: absolute; top: 72px; left: 50%; transform: translateX(-50%); z-index: 1000; background: rgba(26,24,21,0.78); color: white; font-family: 'DM Sans', sans-serif; font-size: 0.75rem; font-weight: 500; padding: 5px 14px; border-radius: 50px; white-space: nowrap; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    #result-pill.show { opacity: 1; }
    .leaflet-popup-content-wrapper { border-radius: 12px !important; box-shadow: 0 6px 32px rgba(0,0,0,0.16) !important; padding: 0 !important; overflow: hidden !important; }
    .leaflet-popup-content { margin: 0 !important; min-width: 220px !important; max-width: 260px !important; }
    .leaflet-popup-tip-container { margin-top: -1px !important; }
    .popup-inner { padding: 14px 16px 12px; font-family: 'DM Sans', sans-serif; }
    .popup-denom { font-size: 0.62rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: #b8955a; margin-bottom: 3px; }
    .popup-name { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; font-weight: 600; color: #1a1815; line-height: 1.25; margin-bottom: 8px; }
    .popup-row { font-size: 0.78rem; color: #6b6762; line-height: 1.5; margin-bottom: 2px; }
    .popup-row a { color: #4a7fa5; text-decoration: none; font-weight: 500; }
    .popup-dir { display: block; margin-top: 10px; background: #2a2825; color: white; text-align: center; border-radius: 6px; padding: 7px; font-size: 0.78rem; font-weight: 500; text-decoration: none; transition: background 0.2s; }
    .popup-dir:hover { background: #b8955a; color: white; }
    #toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: rgba(26,24,21,0.85); color: white; padding: 8px 18px; border-radius: 50px; font-family: 'DM Sans', sans-serif; font-size: 0.82rem; z-index: 2000; opacity: 0; transition: opacity 0.25s; pointer-events: none; white-space: nowrap; }
    #toast.show { opacity: 1; }
    #map-overlay { display: none; position: absolute; inset: 0; z-index: 900; background: rgba(0,0,0,0.45); align-items: center; justify-content: center; flex-direction: column; gap: 12px; cursor: pointer; user-select: none; -webkit-user-select: none; }
    #map-overlay.mobile { display: flex; }
    #map-overlay.active { display: none !important; }
    #map-overlay .ov-icon { font-size: 40px; }
    #map-overlay .ov-title { color: #fff; font-family: 'DM Sans', sans-serif; font-size: 17px; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
    #map-overlay .ov-hint { color: rgba(255,255,255,0.8); font-family: 'DM Sans', sans-serif; font-size: 13px; }
    @media (max-width: 500px) { #search-bar { min-width: 0; width: 94vw; padding: 7px 8px 7px 14px; } #search-bar .logo { display: none; } #search-bar .divider { display: none; } #placeInput { width: auto; } }
  </style>
</head>
<body>
<div id="map"></div>
<div id="search-bar">
  <span class="logo">⛪ Church Finder</span>
  <div class="divider"></div>
  <input id="placeInput" type="search" placeholder="City, state, province or postcode" autocomplete="off" enterkeyhint="search" aria-label="City, state, province or postcode">
  <select id="radiusSelect">
    <option value="5">5 mi</option>
    <option value="10" selected>10 mi</option>
    <option value="25">25 mi</option>
    <option value="50">50 mi</option>
  </select>
  <button id="searchBtn" onclick="doSearch()">Search</button>
  <button id="clearBtn" onclick="doClear()">✕</button>
</div>
<div id="result-pill"></div>
<div id="toast"></div>
<div id="map-overlay" onclick="activateMap()">
  <div class="ov-icon">🗺️</div>
  <div class="ov-title">Tap to interact with map</div>
  <div class="ov-hint">Scroll past to continue browsing</div>
</div>
<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbz4WWfiJCPMbc9ZMidVBmjgQmE_0Wiy9eJPzpjH4-n7_ZE4J_Xsvvv_JgqbQ8wVVRhy8g/exec';
  let map, clusterGroup, churches = [], searchCircle = null;
  function isMobile() { return /Android|iPhone|iPad|iPod|Mobile|Touch/i.test(navigator.userAgent) || navigator.maxTouchPoints > 1 || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches); }
  window.addEventListener('load', function() { if (isMobile()) document.getElementById('map-overlay').classList.add('mobile'); initMap(); });
  function activateMap() { document.getElementById('map-overlay').classList.add('active'); }
  document.addEventListener('touchstart', function(e) { const o = document.getElementById('map-overlay'); if (!o.classList.contains('active')) return; if (!document.getElementById('map').contains(e.target)) o.classList.remove('active'); }, { passive: true });
  const toTitle = s => s ? s.replace(/\w\S*/g, w => w[0].toUpperCase() + w.slice(1).toLowerCase()) : '';
  const churchIcon = L.divIcon({ html: '<div style="width:30px;height:30px;background:#2a2825;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,0.35);border:2px solid #b8955a;">⛪</div>', className: '', iconSize: [30,30], iconAnchor: [15,15], popupAnchor: [0,-18] });
  const activeIcon = L.divIcon({ html: '<div style="width:36px;height:36px;background:#b8955a;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 3px 14px rgba(0,0,0,0.4);border:2.5px solid white;">⛪</div>', className: '', iconSize: [36,36], iconAnchor: [18,18], popupAnchor: [0,-20] });
  function clusterIcon(cluster) { const n = cluster.getChildCount(); const size = n >= 20 ? 48 : n >= 10 ? 42 : 36; const fs = Math.round(size * 0.5); return L.divIcon({ html: '<div style="width:' + size + 'px;height:' + size + 'px;background:#2a2825;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:' + fs + 'px;box-shadow:0 3px 12px rgba(0,0,0,0.4);border:2.5px solid #b8955a;">⛪</div>', className: '', iconSize: [size,size], iconAnchor: [size/2,size/2] }); }
  function initMap() {
    map = L.map('map', { zoomControl: true, scrollWheelZoom: false, tap: false }).setView([39.5, -98.35], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors', maxZoom: 19 }).addTo(map);
    clusterGroup = L.markerClusterGroup({ iconCreateFunction: clusterIcon, maxClusterRadius: 80, spiderfyOnMaxZoom: true, showCoverageOnHover: false, zoomToBoundsOnClick: true, disableClusteringAtZoom: 11 });
    map.addLayer(clusterGroup);
    loadChurches();
  }
  function loadChurches() { fetch('churches.json').then(r => r.json()).then(data => { churches = (data.churches || []).map(c => ({ ...c, lat: parseFloat(c.lat) || null, lng: parseFloat(c.lng) || null, id: String(c.id) })); renderMarkers(churches); const pinned = churches.filter(c => c.lat && c.lng); if (pinned.length > 1) map.fitBounds(L.latLngBounds(pinned.map(c => [c.lat, c.lng])).pad(0.15), { maxZoom: 8 }); else if (pinned.length === 1) map.setView([pinned[0].lat, pinned[0].lng], 12); }).catch(() => showToast('Could not load churches — please refresh')); }
  function renderMarkers(list) { clusterGroup.clearLayers(); list.forEach(c => { if (!c.lat || !c.lng) return; const du = 'https://www.google.com/maps/dir/?api=1&destination=' + (c.address || c.city ? encodeURIComponent(joinAddr([c.address, c.city, [c.state, c.zip].filter(Boolean).join(' ')])) : c.lat + ',' + c.lng); const popupHtml = '<div class="popup-inner">' + (c.denom ? '<div class="popup-denom">' + c.denom + '</div>' : '') + '<div class="popup-name">' + toTitle(c.name) + '</div>' + '<div class="popup-row">📍 ' + joinAddr([toTitle(c.address), toTitle(c.city), [c.state, c.zip].filter(Boolean).join(' ')]) + '</div>' + (c.phone ? '<div class="popup-row">📞 ' + c.phone + '</div>' : '') + (c.times ? '<div class="popup-row">🕐 ' + c.times + '</div>' : '') + (c.website ? '<div class="popup-row">🌐 <a href="' + c.website + '" target="_blank">' + c.website.replace(/^https?:\/\/(www\.)?/,'') + '</a></div>' : '') + '<a class="popup-dir" href="' + du + '" target="_blank">🗺 Get Directions</a></div>'; const m = L.marker([c.lat, c.lng], { icon: churchIcon }).bindPopup(L.popup({ maxWidth: 280 }).setContent(popupHtml)); m.on('popupopen', () => m.setIcon(activeIcon)); m.on('popupclose', () => m.setIcon(churchIcon)); m.churchId = c.id; clusterGroup.addLayer(m); }); }
  function haversine(lat1,lng1,lat2,lng2) { const R=3958.8,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180; return R*2*Math.asin(Math.sqrt(Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2)); }
  const joinAddr = parts => parts.filter(p => p && String(p).trim()).join(', ');
  // Places big enough that "churches inside it" beats "churches within X miles of its center"
  const AREA_TYPES = ['country','state','province','region','state_district','county','territory','archipelago'];
  function isAreaResult(r) { return r.geojson && /Polygon/.test(r.geojson.type) && (AREA_TYPES.includes(r.addresstype) || (r.place_rank && r.place_rank <= 10)); }
  function inRing(lng, lat, ring) { let inside = false; for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) { const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1]; if (((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside; } return inside; }
  function inPolygon(lng, lat, poly) { if (!inRing(lng, lat, poly[0])) return false; for (let k = 1; k < poly.length; k++) if (inRing(lng, lat, poly[k])) return false; return true; }
  function inGeo(lng, lat, g) { return g.type === 'Polygon' ? inPolygon(lng, lat, g.coordinates) : g.coordinates.some(p => inPolygon(lng, lat, p)); }
  function countriesWithChurches() { const s = new Set(); churches.forEach(c => s.add((c.country || 'US').toLowerCase())); return s; }
  function placeLabel(r) { return (r.name || r.display_name.split(',')[0]).trim(); }
  function geocode(q) {
    const base = 'https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&polygon_geojson=1&polygon_threshold=0.005&limit=8&accept-language=en';
    // Bare 5-digit numbers are almost always US ZIPs (keeps the old behavior working)
    const url = /^\d{5}$/.test(q) ? base + '&postalcode=' + q + '&countrycodes=us' : base + '&q=' + encodeURIComponent(q);
    return fetch(url).then(r => r.json()).then(list => {
      if (!list.length) return null;
      // Prefer places in countries where we actually list churches (e.g. "Georgia" → the US state, not the country)
      const have = countriesWithChurches();
      return list.find(r => r.address && have.has(r.address.country_code)) || list[0];
    });
  }
  function doSearch() {
    const q = document.getElementById('placeInput').value.trim();
    if (q.length < 2) { showToast('Enter a city, state, province or postcode'); return; }
    const radius = parseFloat(document.getElementById('radiusSelect').value);
    showToast('Searching…');
    geocode(q).then(place => {
      if (!place) { showToast('Place not found — try adding the country'); return; }
      if (searchCircle) { map.removeLayer(searchCircle); searchCircle = null; }
      const center = { lat: parseFloat(place.lat), lng: parseFloat(place.lon) };
      const label = placeLabel(place);
      const pinned = churches.filter(c => c.lat && c.lng);
      let found, where;
      if (isAreaResult(place)) {
        // State / province / country: show every church inside its border
        searchCircle = L.geoJSON(place.geojson, { style: { color: '#b8955a', fillColor: '#b8955a', fillOpacity: 0.06, weight: 1.5, dashArray: '5,5' }, interactive: false }).addTo(map);
        found = pinned.filter(c => inGeo(c.lng, c.lat, place.geojson));
        where = 'in ' + label;
      } else {
        // City / town / postcode: radius around it
        searchCircle = L.circle([center.lat, center.lng], { radius: radius * 1609.34, color: '#b8955a', fillColor: '#b8955a', fillOpacity: 0.06, weight: 1.5, dashArray: '5,5', interactive: false }).addTo(map);
        found = pinned.map(c => ({ ...c, dist: haversine(center.lat, center.lng, c.lat, c.lng) })).filter(c => c.dist <= radius).sort((a, b) => a.dist - b.dist);
        where = 'within ' + radius + ' mi of ' + label;
      }
      renderMarkers(found);
      document.getElementById('clearBtn').classList.add('visible');
      const n = found.length, noun = 'church' + (n !== 1 ? 'es' : '');
      if (n) { map.fitBounds(L.latLngBounds(found.map(c => [c.lat, c.lng])).pad(0.3), { maxZoom: 13 }); showPill('Found ' + n + ' ' + noun + ' ' + where); showToast('Found ' + n + ' ' + noun); }
      else { if (searchCircle.getBounds) map.fitBounds(searchCircle.getBounds()); else map.setView([center.lat, center.lng], 11); showPill('No churches found ' + where + (isAreaResult(place) ? '' : ' — try wider')); showToast('No churches found'); }
    }).catch(() => showToast('Search failed — check your connection'));
  }
  function doClear() { document.getElementById('placeInput').value=''; document.getElementById('clearBtn').classList.remove('visible'); if(searchCircle){map.removeLayer(searchCircle);searchCircle=null;} hidePill(); renderMarkers(churches); const pinned=churches.filter(c=>c.lat&&c.lng); if(pinned.length>1)map.fitBounds(L.latLngBounds(pinned.map(c=>[c.lat,c.lng])).pad(0.15),{maxZoom:8}); }
  let pillTimer; function showPill(msg){const p=document.getElementById('result-pill');p.textContent=msg;p.classList.add('show');clearTimeout(pillTimer);pillTimer=setTimeout(()=>p.classList.remove('show'),4000);} function hidePill(){document.getElementById('result-pill').classList.remove('show');}
  let toastTimer; function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2500);}
  document.getElementById('placeInput').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});
</script>
</body>
</html>
